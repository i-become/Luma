server:
  port: 1998

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: is-token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: 3600
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: NdGf1890NYas9fO1ND
  oauth2-server:
    # 是否在返回值中隐藏默认的状态字段 (code、msg、data)
    hide-status-field: true
    # 定义哪些 scope 是高级权限，多个用逗号隔开
    #    higher-scope: userinfo
    # 定义哪些 scope 是低级权限，多个用逗号隔开
    lower-scope: openid

spring:
  data:
    # redis配置
    redis:
      # Redis数据库索引（默认为0）
      database: 0
      # Redis服务器地址
      host: 47.120.9.24
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: redis_a3cDZQ
      # 连接超时时间
      timeout: 5s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 100
          # 连接池最大阻塞等待时间（使用-1表示没有限制）
          max-wait: 5000ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 1
        cluster:
          refresh:
            # 开启自适应刷新节点拓扑关系 最短周期20秒
            adaptive: true
            period: 20
  ############## dynamic-datasource 动态数据源 ##############
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://47.120.9.24:3306/is_tjx
          username: root
          password: mysql_WprEzR
          driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  messages:
    basename: i18n.messages
    encoding: UTF-8


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

luma:
  # 请求前缀
  api:
    web-api:
      prefix: /api/v1
      controller: "com.luma.admin.controller.**"
      exclude-path-patterns:
        - "/login"
        - "/error"
        - "/live/event"
        - "/mqtt/auth"
    open-api:
      prefix: /openapi/v1
      controller: "com.luma.openapi.controller.**"
      exclude-path-patterns:
        - "/oauth2/**"
  tenant:
    # 多租户忽略的表，查询这部分表时不会添加租户条件
    ignore-tables: sys_menu,sys_role_dept,sys_role_menu,sys_tenant,sys_user_post,sys_user_role,client,client_sys_user,client_sys_tenant


